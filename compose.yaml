services:
  db:
    image: postgres:16.15
    container_name: reniec-huanuco-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reniec_huanuco}
      POSTGRES_USER: ${POSTGRES_USER:-reniec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reniec_dev}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reniec} -d ${POSTGRES_DB:-reniec_huanuco}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: reniec-huanuco-api
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./api:/var/www
    ports:
      - "${API_PORT:-18080}:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost:18080}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-reniec_huanuco}
      DB_USERNAME: ${POSTGRES_USER:-reniec}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-reniec_dev}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction --prefer-dist
      && php artisan serve --host=0.0.0.0 --port=8000"

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: reniec-huanuco-web
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "${WEB_PORT:-14200}:4200"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api
    command: >
      sh -c "npm install --no-audit --no-fund
      && npx ng serve --host 0.0.0.0 --port 4200 --proxy-config proxy.conf.json"

volumes:
  pgdata:
  web_node_modules:
